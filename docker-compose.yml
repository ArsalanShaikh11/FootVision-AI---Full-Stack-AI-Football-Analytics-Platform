services:
  db:
    image: postgres:16-alpine
    container_name: footvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: footvision
      POSTGRES_PASSWORD: footvision_password
      POSTGRES_DB: footvision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footvision -d footvision"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: footvision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://footvision:footvision_password@db:5432/footvision
      - STORAGE_DIR=/app/storage
      - MAX_UPLOAD_SIZE_MB=100
      - YOLO_MODEL_NAME=yolov8n.pt
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: footvision-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
